
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razorpay Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <h2>E-commerce Test Payment</h2>
  <p>Order Amount: ₹10,499.93</p>
  <button id="pay-button">Pay with Razorpay</button>
  <pre id="result"></pre>

  <script>
    const result = document.getElementById('result');

    document.getElementById('pay-button').addEventListener('click', async () => {
      result.textContent = 'Creating payment order...';

      try {
        // Use a fresh CUSTOMER JWT obtained after login.
        const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5ODhjYzQ2Zi1jMDkyLTQyZDctYTU4NC01ZDgxNTczY2Q2MzUiLCJlbWFpbCI6InNhdXJhdi50aGFrdXJAYW52aWFtLmNvbSIsInJvbGUiOiJDVVNUT01FUiIsImlhdCI6MTc5MjA1MDQ4OCwiZXhwIjoxNzkyMDU0MDg4fQ.6aIgRlthWTWUAbTPJsk8bc4Q5-izI1wlyWz78DR5H78';

        const response = await fetch('http://localhost:3000/payments/create-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            orderId: '119454b3-a114-498c-b8a6-e643b3664332',
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Could not create payment order');
        }

        const options = {
          key: data.keyId,
          amount: data.amount,
          currency: data.currency,
          name: 'E-commerce Test Store',
          description: 'Test order payment',
          order_id: data.razorpayOrderId,

          handler: async function (payment) {
            result.textContent = 'Payment completed. Verifying with backend...';

            try {
              const verifyResponse = await fetch('http://localhost:3000/payments/verify', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify({
                  razorpay_order_id: payment.razorpay_order_id,
                  razorpay_payment_id: payment.razorpay_payment_id,
                  razorpay_signature: payment.razorpay_signature,
                }),
              });

              const verifyData = await verifyResponse.json();

              if (!verifyResponse.ok) {
                throw new Error(verifyData.message || 'Payment verification failed');
              }

              result.textContent =
                'Payment verified successfully!\n' +
                'Order status: ' + verifyData.order.status + '\n' +
                'Order ID: ' + verifyData.order.id;
            } catch (error) {
              result.textContent = 'Verification failed: ' + error.message;
            }
          },

          modal: {
            ondismiss: function () {
              result.textContent = 'Checkout closed. Order has not been confirmed.';
            },
          },
        };

        const checkout = new Razorpay(options);

        checkout.on('payment.failed', function (payment) {
          result.textContent =
            'Payment failed: ' +
            (payment.error.description || 'Please try again');
        });

        checkout.open();
      } catch (error) {
        result.textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
